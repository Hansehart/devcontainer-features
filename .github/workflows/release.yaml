name: "Release dev container features"
on:
  workflow_dispatch:
  push:
    tags:
      - '*-[0-9]+.[0-9]+.[0-9]+'

# Publish releases one after another, each pushing every new version to the registry.
concurrency:
  group: publish-features
  cancel-in-progress: false

jobs:
  # Publishes the features whose release a tag marks.
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Publish"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          # Leave tagging to release-please.
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
