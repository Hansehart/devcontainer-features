name: "Test features"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [age, claude-code, codex, docker-in-docker, headless-chrome, latex, node, sops, uv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the dev container CLI
        run: npm install -g @devcontainers/cli@0.88.0
      - name: "Test ${{ matrix.feature }}"
        run: devcontainer features test -f ${{ matrix.feature }} -i mcr.microsoft.com/devcontainers/base:ubuntu-24.04 .
