name: "Test features"
on:
  pull_request:

jobs:
  # Narrows the test matrix down to the features a pull request touches.
  detect:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.select.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full history, so the diff reaches the base commit.
          fetch-depth: 0
      - name: "Select the features to test"
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Treat every directory under the sources as a feature.
          all=$(ls src | jq -Rsc 'split("\n") | map(select(length > 0))')

          # Diff from where the branch left main, so the list holds this branch's own changes.
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed"

          # Test every feature when the CI setup itself changes.
          if echo "$changed" | grep -qE '^\.github/'; then
            echo "features=$all" >> "$GITHUB_OUTPUT"
            echo "CI configuration changed, testing every feature: $all"
            exit 0
          fi

          # Select a feature when its own sources or tests change.
          selected=$(
            for feature in $(ls src); do
              if echo "$changed" | grep -qE "^(src|test)/${feature}/"; then
                echo "$feature"
              fi
            done | jq -Rsc 'split("\n") | map(select(length > 0))'
          )
          echo "features=$selected" >> "$GITHUB_OUTPUT"
          echo "Testing affected features: $selected"

  test:
    needs: detect
    # Run the job only when some feature was selected.
    if: ${{ needs.detect.outputs.features != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect.outputs.features) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the dev container CLI
        run: npm install -g @devcontainers/cli@0.89.0
      - name: "Test ${{ matrix.feature }}"
        run: devcontainer features test -f ${{ matrix.feature }} -i ubuntu:24.04 .
