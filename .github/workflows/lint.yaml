name: "Lint shell scripts"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: find lib src test -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Test the shared library"
        run: bash lib/test.sh
      - name: "Check every feature carries the current library"
        run: bash lib/sync.sh --check
