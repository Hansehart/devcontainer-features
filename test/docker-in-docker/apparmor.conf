# Reference AppArmor profile for a container running the rootless engine.
#
# Derived from the profile the runtime generates for every container, which denies mount
# outright and so keeps the engine from starting. Mounts are permitted here; the file
# denials are kept, and they are what the container's unmasked /proc would otherwise lose.
#
# Load it on the host, which is the only place a profile can be registered:
#     apparmor_parser -r apparmor.conf
# then start the container with:
#     --security-opt apparmor=dind-rootless
#
# It mediates files, not mounts. Read it as narrowing what the engine can reach, not as
# confining what it can mount.

abi <abi/3.0>,

#include <tunables/global>

profile "dind-rootless" flags=(attach_disconnected,mediate_deleted) {
  #include <abstractions/base>

  network,
  # Disallow AF_ALG (Linux kernel crypto API); see https://copy.fail/
  deny network alg,
  capability,
  file,
  umount,

  # The engine creates its namespaces and lays out every container's filesystem, so the
  # mounts the generated profile denies are the ones it cannot run without.
  mount,
  pivot_root,

  # Host (privileged) processes may send signals to container processes.
  signal (receive) peer=unconfined,
  # runc may send signals to container processes (for "docker stop").
  signal (receive) peer=runc,
  # crun may send signals to container processes (for "docker stop" when used with crun OCI runtime).
  signal (receive) peer=crun,
  # Container processes may send signals amongst themselves.
  signal (send,receive) peer="dind-rootless",

  deny @{PROC}/* w,   # deny write for all files directly in /proc (not in a subdir)
  # deny write to files not in /proc/<number>/** or /proc/sys/**
  deny @{PROC}/{[^1-9/],[^1-9/][^0-9/],[^1-9s/][^0-9y/][^0-9s/],[^1-9/][^0-9/][^0-9/][^0-9/]*}/** w,
  # deny /proc/sys except /proc/sys/k* and /proc/sys/net/*, the latter carrying the sysctls
  # the engine sets on a container's interface.
  deny @{PROC}/sys/[^kn]** w,
  deny @{PROC}/sys/n[^e]** w,
  deny @{PROC}/sys/ne[^t]** w,
  deny @{PROC}/sys/kernel/{?,??,[^s][^h][^m]**} w,  # deny everything except shm* in /proc/sys/kernel/
  deny @{PROC}/sysrq-trigger rwklx,
  deny @{PROC}/kcore rwklx,

  deny /sys/[^f]*/** wklx,
  deny /sys/f[^s]*/** wklx,
  deny /sys/fs/[^c]*/** wklx,
  deny /sys/fs/c[^g]*/** wklx,
  deny /sys/fs/cg[^r]*/** wklx,
  deny /sys/firmware/** rwklx,
  deny /sys/devices/virtual/powercap/** rwklx,
  deny /sys/kernel/security/** rwklx,

  # allow processes within the container to trace each other,
  # provided all other LSM and yama setting allow it.
  ptrace (trace,tracedby,read,readby) peer="dind-rootless",
}
